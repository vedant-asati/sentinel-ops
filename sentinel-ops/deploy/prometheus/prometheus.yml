global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "checkout-service"
    static_configs:
      - targets: ["checkout-service:8001"]

  - job_name: "cart-service"
    static_configs:
      - targets: ["cart-service:8002"]

  - job_name: "pricing-service"
    static_configs:
      - targets: ["pricing-service:8003"]

  - job_name: "payment-service"
    static_configs:
      - targets: ["payment-service:8004"]
