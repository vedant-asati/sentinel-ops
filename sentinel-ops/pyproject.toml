[project]
name = "sentinel-ops"
version = "0.1.0"
description = "Autonomous AI Site Reliability Engineering & Root Cause Analysis Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Vedant Asati", email = "vedant.dev.jsr@gmail.com" }
]
dependencies = [
    "langchain-core>=0.3.30",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.70",
    "google-genai>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "networkx>=3.3",
    "rich>=13.7.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
sentinel-ops = "sentinel_ops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_ops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
