name: Sentinel-Ops CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Dependencies
        run: |
          cd sentinel-ops
          uv sync --extra dev

      - name: Run unit, adversarial, and observability contract tests
        run: |
          cd sentinel-ops
          uv run --extra dev python -m pytest -v

      - name: Run fixture replay matrix (offline verification gate)
        run: |
          cd sentinel-ops
          uv run --extra dev python -m benchmarks.runner

      - name: Run Triage Latency & Epistemic Report
        run: |
          cd sentinel-ops
          uv run python -m sentinel_ops.analytics.dora

      - name: Gate incident diagnoses on fresh counterfactual cases
        working-directory: sentinel-ops
        run: uv run --extra dev python -m benchmarks.challenge_gate --report challenge-results.json

      - name: Save challenge results and replay seed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-challenge-results
          path: sentinel-ops/challenge-results.json
          if-no-files-found: warn

  docker-sandbox-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          cd sentinel-ops/deploy
          docker compose config
