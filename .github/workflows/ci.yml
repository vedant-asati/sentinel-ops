name: Sentinel-Ops CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Dependencies
        run: |
          cd sentinel-ops
          uv sync

      - name: Run Unit Tests (22 Tests)
        run: |
          cd sentinel-ops
          uv run pytest -v

      - name: Run 3-Case Benchmark Replay Matrix
        run: |
          cd sentinel-ops
          uv run python -m benchmarks.runner

      - name: Run DORA Metrics Analytics Report
        run: |
          cd sentinel-ops
          uv run python -m sentinel_ops.analytics.dora

  docker-sandbox-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          cd sentinel-ops/deploy
          docker compose config
